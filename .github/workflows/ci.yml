name: Offline contracts and NuGet package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_ROLL_FORWARD: Minor
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize writable .NET CLI home
        shell: bash
        run: printf 'DOTNET_CLI_HOME=%s/dotnet-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Install .NET 6, 8 and 9 runtimes (build SDK remains pinned by global.json)
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://dot.net/v1/dotnet-install.sh --output "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --channel 6.0 --install-dir "$DOTNET_ROOT" --no-path
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --channel 8.0 --install-dir "$DOTNET_ROOT" --no-path
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --channel 9.0 --install-dir "$DOTNET_ROOT" --no-path
      - name: Release script behavior contracts
        run: python3 -B -m unittest discover -s tools/NuGetRelease -p 'test_*.py'
      - name: Four runtimes with offline suites, package consumers and first initialization
        shell: bash
        run: bash eng/release.sh prepare --tag "v0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}" --commit "$(git rev-parse HEAD)"
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-validation
          path: |
            .local/nuget-release/**/*.log
            .local/nuget-release/**/*.trx
            .local/nuget-release/**/commands.jsonl
            .local/nuget-release/**/package-manifest.json
            .local/nuget-release/**/*_assets.json
            .local/nuget-release/consumers.json
            .local/nuget-release/**/first-init*.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
