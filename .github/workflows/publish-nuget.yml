name: Publish tagged NuGet package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate strict SemVer tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash eng/release.sh version "$RELEASE_TAG"
      - name: Initialize writable .NET CLI home
        shell: bash
        run: printf 'DOTNET_CLI_HOME=%s/dotnet-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Release script behavior contracts
        run: python3 -B -m unittest discover -s tools/NuGetRelease -p 'test_*.py'
      - name: Validate all offline suites and the actual tagged package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash eng/release.sh prepare --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - name: Preserve validated package and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tagged-nuget-validation
          path: |
            .local/nuget-release/**/feed/*.nupkg
            .local/nuget-release/**/*.log
            .local/nuget-release/**/*.trx
            .local/nuget-release/**/commands.jsonl
            .local/nuget-release/**/package-manifest.json
            .local/nuget-release/**/first-init*.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Push validated package to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$NUGET_API_KEY"
          IFS= read -r package < .local/nuget-release/package-path.txt
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
